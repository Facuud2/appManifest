<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Liquid Rainbow Pastel Mesh -->
    <radialGradient id="meshCenter" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFCF8" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#F6C9D9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#DCCFFF" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#CBE9F8" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#D0EFDF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8EDB9" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#FFFCF8"/>
  <rect width="512" height="512" rx="128" fill="url(#meshCenter)"/>

  <!-- Subtle overlay border for glass feel -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4"/>

  <!-- Central Manifestation Aura Symbol: Luminous Starburst -->
  <g filter="url(#softGlow)" transform="translate(256, 256)">
    <!-- Aura circle -->
    <circle r="96" fill="url(#sparkleGlow)" opacity="0.8"/>

    <!-- 8-point central radiant star -->
    <path d="M 0,-85 Q 0,0 85,0 Q 0,0 0,85 Q 0,0 -85,0 Q 0,0 0,-85 Z" fill="#493E55" opacity="0.92"/>
    <path d="M 0,-60 Q 0,0 60,0 Q 0,0 0,60 Q 0,0 -60,0 Q 0,0 0,-60 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Diagonal delicate rays -->
    <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" fill="#F6C9D9" opacity="0.85" transform="rotate(45)"/>

    <!-- Small celestial accent sparkles -->
    <circle cx="80" cy="-70" r="8" fill="#F8EDB9"/>
    <circle cx="-75" cy="85" r="6" fill="#DCCFFF"/>
    <circle cx="95" cy="65" r="5" fill="#D0EFDF"/>
    <circle cx="-85" cy="-60" r="7" fill="#CBE9F8"/>
  </g>
</svg>
